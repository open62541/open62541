name: CERT C clang-tidy

on:
  push:
    branches: [ '1.5' ]
    paths:
      - '.clang-tidy'
      - '.github/workflows/clang-tidy.yml'
      - 'tools/ci.sh'
      - 'arch/**/*.c'
      - 'arch/**/*.h'
      - 'deps/**/*.c'
      - 'deps/**/*.h'
      - 'include/**/*.h'
      - 'plugins/**/*.c'
      - 'plugins/**/*.h'
      - 'src/**/*.c'
      - 'src/**/*.h'
  pull_request:
    branches: [ '1.5' ]
    paths:
      - '.clang-tidy'
      - '.github/workflows/clang-tidy.yml'
      - 'tools/ci.sh'
      - 'arch/**/*.c'
      - 'arch/**/*.h'
      - 'deps/**/*.c'
      - 'deps/**/*.h'
      - 'include/**/*.h'
      - 'plugins/**/*.c'
      - 'plugins/**/*.h'
      - 'src/**/*.c'
      - 'src/**/*.h'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clang-tidy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    name: Changed production code
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout open62541
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq clang-18 clang-tidy-18

      - name: Prepare clang-tidy
        run: source tools/ci.sh && clang_tidy_prepare

      - name: Check changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: source tools/ci.sh && clang_tidy_changed "${BASE_SHA}" "${HEAD_SHA}"
